<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" width="800" height="256">
  <!-- AIRUX wordmark: the Wave-A mark and the name drawn in the same rounded strokes (no font
       needed, so it renders the same everywhere) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2532"/><stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#59c38a"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d4f3e2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
    <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#2b3a4b" stroke-width="3"/>
    <path d="M60 206 L128 46 L196 206" fill="none" stroke="url(#ink)" stroke-width="24"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M85 148 C 94 148, 96 128, 106.5 128 S 118 168, 128 168 S 139.5 128, 149.5 128 S 162 148, 171 148"
          fill="none" stroke="url(#wave)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="none" stroke="#e6e9ee" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 190 L340 70 L380 190 M314 150 L366 150"/>
    <path d="M420 70 L420 190"/>
    <path d="M462 190 L462 70 L500 70 C 524 70, 534 86, 534 103 C 534 120, 524 136, 500 136 L462 136 M500 136 L534 190"/>
    <path d="M576 70 L576 148 C 576 174, 592 190, 612 190 C 632 190, 648 174, 648 148 L648 70"/>
    <path d="M690 70 L770 190 M770 70 L690 190"/>
