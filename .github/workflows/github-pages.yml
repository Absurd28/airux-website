# Publishes the site on GitHub Pages (https://absurd28.github.io/airux-website/) on every push to
# main; the tests run first, so a broken link or a missing hash never goes live.
name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: pip install pytest==9.2.0 && python3 -m pytest -q tests
      - name: Build
        run: SITE_BASE=/${{ github.event.repository.name }}/ python3 build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
