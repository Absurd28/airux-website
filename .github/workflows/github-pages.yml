# The site itself is on Cloudflare Pages (https://airux-os.pages.dev), which builds every push to
# main. This workflow runs the tests on every push, and keeps the old address
# (https://absurd28.github.io/airux-website/) working: each page there forwards to the same page
# on the new one.
name: Tests, and forwards from the old address
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: pip install pytest==9.2.0 && python3 -m pytest -q tests
      - name: Build the forwarding pages
        run: SITE_BASE=/${{ github.event.repository.name }}/ python3 build.py --redirect
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
